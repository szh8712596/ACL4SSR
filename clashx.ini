;=================== 高级设置 ===================
enable_rule_generator=true
overwrite_original_rules=true

; 广东电信优化参数
; 测速间隔：300 秒（5 分钟），平衡准确性和速度
; 容错：3 次，避免误判
; 测试次数：亚洲 30 次，欧美 15 次
; 超时：亚洲 150ms，欧美 200ms

;=================== 负载均衡说明 ===================
; ⚖️ 负载均衡模式说明:
; 1. load-balance 会将流量分散到多个节点
; 2. 同一域名/连接会固定使用一个节点（保持会话）
; 3. 不同请求会分配到不同节点（负载分散）
; 4. 节点故障时自动剔除，流量重新分配
; 5. 适合：下载、视频、大文件传输
; 6. 不适合：在线游戏、视频会议（需要低延迟抖动）

; 使用建议:
; - 日常浏览：使用 ⚖️ 负载均衡（速度最快）
; - 看视频：使用 ⚖️ 负载均衡（多节点并发）
; - 下载文件：使用 ⚖️ 负载均衡（带宽叠加）
; - 在线游戏：使用 ♻️ 自动选择（低延迟抖动）
; - AI 对话：使用 🤖 OpenAi（保持会话连续性）
; - 重要任务：使用 ♻️ 自动选择（最稳定）
;=================================================

;=================== 性能对比 ===================
; 单节点模式:
;   - 速度：取决于单个节点带宽
;   - 稳定性：节点故障即断网
;   - 延迟抖动：低
;
; 负载均衡模式 (⚖️ 负载均衡):
;   - 速度：多个节点带宽叠加（理论提升 2-5 倍）
;   - 稳定性：节点故障自动切换，不影响使用
;   - 延迟抖动：中等（不同请求可能走不同节点）
;   - 适用场景：下载、视频、大流量应用
;
; 自动选择模式 (♻️ 自动选择):
;   - 速度：选择最快单节点
;   - 稳定性：故障自动切换
;   - 延迟抖动：最低
;   - 适用场景：游戏、视频会议、实时应用
;=================================================
