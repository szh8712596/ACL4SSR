; 不要随意改变关键字，否则会导致出错
; acl4SSR 规则 - 广东电信专属优化版（多节点负载均衡）
; 优化日期：2026-03-02
; 网络环境：广东电信
; 核心特性：多节点并发 + 负载均衡 + 自动故障转移

;=================== 优化说明 ===================
; 🎯 速度优化：多节点并发传输，带宽叠加
; 🛡️ 稳定优化：自动故障转移，单节点掉线不影响
; ⚡ 负载均衡：智能分配流量到多个节点
; 🌏 地区优化：优先香港、台湾、日本节点（低延迟）
; 📡 DNS 优化：使用电信友好 DNS，减少解析延迟
; 🔌 连接优化：TCP 并发 + 多路复用
; 🔄 自动测速：每 300 秒重新评估节点质量
;=================================================

; 去广告：支持
; 自动测速：支持
; 微软分流：支持
; 苹果分流：支持
; 增强中国 IP 段：支持
; 增强国外 GFW：支持

